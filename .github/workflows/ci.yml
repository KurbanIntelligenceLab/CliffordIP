name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install CPU torch and the project
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install torch-geometric
          uv pip install torch-cluster -f https://data.pyg.org/whl/torch-2.8.0+cpu.html
          uv pip install -e ".[all]" pytest mypy ruff

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -v
      - run: uv run cliffordip check-equivariance --o3 --json

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - name: The wheel must not carry review-era trees
        run: |
          uv pip install --system twine
          twine check dist/*
          ! unzip -l dist/*.whl | grep -E "baselines/|results/"
