[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "cliffordip"
version = "1.0.0"
description = "CliffordIP: Clifford Algebra Equivariant Interatomic Potentials for Heterogeneous Catalysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["machine-learning", "interatomic-potentials", "clifford-algebra", "equivariant-gnn", "mlip"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.1",
    "torch-geometric>=2.5",
    "omegaconf>=2.3",
    "lightning>=2.2",
    "jsonargparse[signatures]>=4.27.7",
    "numpy>=1.24",
]

[project.optional-dependencies]
oc20 = ["lmdb>=1.4"]
oc22 = ["lmdb>=1.4"]
md17 = ["ase>=3.22"]
qm9  = ["ase>=3.22"]
log  = ["wandb>=0.16"]
all  = ["cliffordip[oc20,oc22,md17,qm9,log]"]

[dependency-groups]
dev = [
    "cliffordip[all]",
    "pytest>=7.4",
    "mypy>=1.8",
    "ruff>=0.3",
]

[project.scripts]
cliffordip = "cliffordip.cli:main"
cliffordip-train = "cliffordip.lightning.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cliffordip"]

[tool.hatch.build.targets.sdist]
exclude = [".DS_Store"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.uv]
default-groups = ["dev"]

[tool.mypy]
ignore_missing_imports = true
files = ["src/cliffordip"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

# Modules with no torch.nn.Module dynamic attribute access are fully typed.
[[tool.mypy.overrides]]
module = [
    "cliffordip.checkpoints",
    "cliffordip.config",
    "cliffordip.neighbors",
    "cliffordip.train.checkpoints",
    "cliffordip.train.registry",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["slow: requires downloaded datasets"]
addopts = "-m 'not slow'"
