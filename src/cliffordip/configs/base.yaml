# Shared defaults. Merge order: base -> dataset -> model -> override yaml -> CLI.

seed: 42

training:
  batch_size: 32
  lr: 1.0e-4
  weight_decay: 0.0
  optimizer: adam          # adam | adamw
  lr_scheduler: null       # null | step | cosine | plateau

  num_workers: 0
  pin_memory: false
  persistent_workers: false
  prefetch_factor: 4

dataset:
  name: null               # required
  data_root: null          # required
  task_type: scalar        # scalar | energy_forces | s2ef | is2re
  force_weight: 1.0
  val_subsample_frac: null # keep this leading fraction of the validation split

model:
  name: null               # required
  interface: data_wrapper
  cutoff: 5.0
