# OC22 IS2RE-Total dataset config — oxide electrocatalysis, energy only
# https://fair-chem.github.io/catalysts/datasets/oc22.html
dataset:
  name: oc22_is2re
  data_root: data/OC22
  task_type: is2re
  task: is2re
  split_train: train
  split_val: val_id
  split_test: null  # val_ood not downloaded; override via dataset.split_test if needed
  ewt_threshold: 0.02
  max_train_samples: null
  max_val_samples: null
  max_test_samples: null

training:
  batch_size: 16
  loss: l1

model:
  cutoff: 6.0
