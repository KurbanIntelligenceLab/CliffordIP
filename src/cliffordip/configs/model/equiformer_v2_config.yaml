# EquiformerV2 default configuration
# Compact config targeting ~1M parameters for faster training
model:
  name: equiformer_v2
  interface: data_wrapper

  num_layers: 2
  sphere_channels: 30
  attn_hidden_channels: 20
  num_heads: 4
  attn_alpha_channels: 16
  attn_value_channels: 8
  ffn_hidden_channels: 64

  # Spherical harmonics (reduced for efficiency)
  lmax_list: [4]
  mmax_list: [2]

  # Graph construction
  cutoff: 6.0
  max_neighbors: 50

  # Number of atom types (periodic table)
  n_atom_types: 100

  # Task compatibility
  task_type: "s2ef"  # Structure to Energy & Forces

  # Note: For the full OC20 S2EF-All+MD config from the paper (~148M params), use:
  # num_layers: 12, sphere_channels: 128, attn_hidden_channels: 128,
  # num_heads: 8, ffn_hidden_channels: 512, lmax_list: [6]
